<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Funcionário</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  <style>
    body { padding: 2rem; }
    button { margin-top: 1rem; }
  </style>
</head>

<body>
  <div class="container">
    <h3>Cadastro de Funcionário da Clínica</h3>
    <main>
      <form action="cadastra-funcionario.php" method="POST" class="row g-3 mt-3">

        <div class="col-md-6">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" name="nome" class="form-control" id="nome" required>
        </div>
        
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" id="email" required>
        </div>

        <div class="col-md-6">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" name="senha" class="form-control" id="senha" required>
        </div>

        <div class="col-md-6">
          <label for="funcao" class="form-label">Função / Cargo</label>
          <input type="text" name="funcao" class="form-control" id="funcao" required>
        </div>

        <div class="col-md-6">
          <label for="dataNascimento" class="form-label">Data Nascimento</label>
          <input type="date" name="dataNascimento" class="form-control" id="dataNascimento" required>
        </div>

        <div class="col-md-6">
          <label for="estadoCivil" class="form-label">Estado Civil</label>
          <select name="estadoCivil" class="form-select" id="estadoCivil" required>
            <option value="" selected disabled>Selecione</option>
            <option value="Solteiro(a)">Solteiro(a)</option>
            <option value="Casado(a)">Casado(a)</option>
            <option value="Divorciado(a)">Divorciado(a)</option>
            <option value="Viúvo(a)">Viúvo(a)</option>
          </select>
        </div>
        
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Cadastrar Funcionário</button>
        </div>
        <a href="mostra-funcionarios.php" >Mostrar Funcionários</a>
      </form>
    </main>
  </div>
</body>

</html>
